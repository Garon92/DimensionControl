plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'cz.dmuzik.dimensioncontrol'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'
    // Load the coremod in the dev environment (in production the jar manifest does this)
    extraRunJvmArguments.add('-Dfml.coreMods.load=cz.dmuzik.dimensioncontrol.asm.DCLoadingPlugin')
}

repositories {
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'cz.dmuzik.dimensioncontrol.asm.DCLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
